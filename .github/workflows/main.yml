name: CI/CD Docker

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.ACTIONS_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            quang160325/quang160325:latest
            quang160325/quang160325:${{ github.sha }}

      - name: Triển khai lên DevOps Classroom
        run: |
          REPO="quang160325/quang160325:latest"
          CONTAINER_PORT=80
          MAX_RETRIES=3
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Deployment attempt $((RETRY_COUNT+1))/$MAX_RETRIES"
            
            RESPONSE=$(curl -v -sS -w "\n%{http_code}" -X POST "${{ secrets.DEPLOY_URL }}?repo=$REPO&tag=latest&slot=1&container_port=$CONTAINER_PORT&strict_container_port=0")
            BODY=$(echo "$RESPONSE" | sed "$ d")
            CODE=$(echo "$RESPONSE" | tail -n1)
            
            echo "Webhook HTTP: $CODE"
            
            if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ]; then
              echo "Deploy thành công."
              echo "::group::Chi tiết webhook JSON"
              echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
              echo "::endgroup::"
              exit 0
            elif [ "$CODE" -eq 521 ] || [ "$CODE" -eq 503 ]; then
              echo "Server temporarily unavailable (HTTP $CODE). Retrying in 30 seconds..."
              RETRY_COUNT=$((RETRY_COUNT+1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                sleep 30
              fi
            else
              echo "Deploy thất bại với mã lỗi $CODE."
              echo "::group::Chi tiết webhook JSON"
              echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
              echo "::endgroup::"
              exit 1
            fi
          done
          
          echo "Deploy thất bại sau $MAX_RETRIES lần thử."
          exit 1
